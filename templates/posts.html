<!-- pages/posts.php -->
  <h1>[[ global.posts ]]</h1>
  <h2>[[ posts.search ]]</h2>
  <form method='get' class='form'>
   <label for='by'>[[ posts.author: ]]</label>
   <input type='text' id='by' name='by' placeholder='[[ posts.name ]]' maxlength='64' value='{{{ by }}}'>
   <label for='title'>[[ global.title: ]]</label>
   <input type='text' id='title' name='title' maxlength='32' value='{{{ title }}}'>
   <label for='content'>[[ global.content: ]]</label>
   <input type='text' id='content' name='content' maxlength='2048' value='{{{ content }}}'>
   <br>
   <input type='submit' value='[[ posts.search ]]' class='button'>
  </form>
  {{ tagCloud }}
  {{ pagination }}
  {{ posts }}
  {{ pagination }}
