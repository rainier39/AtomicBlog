<!-- pages/header.php -->
<!DOCTYPE html>
<html lang='[[ code ]]'>
<head>
 <meta charset='UTF-8'>
 <title>{{{ pagetitle }}}</title>
 <meta name='viewport' content='width=device-width,initial-scale=1.0'>
 <link rel='stylesheet' href='{{ theme }}'>
 <link rel='icon' type='image/x-icon' href='{{ icon }}'>
 {{ head }}
</head>
<body>
 <div class='header'>
  <span id='blogtitle'>{{{ blogtitle }}}</span>
  <span id='blogdesc'>{{{ description }}}</span>
 </div>
 {% if (installed) %}
 <div class='navbar'>
  <a class='navbarButton' href='[[[]]]'>[[ navbar.home ]]</a>
  <a class='navbarButton' href='[[[ posts ]]]'>[[ global.posts ]]</a>
  {{ navbar }}
 </div>
 {% endif %}
 <div id='toasts'></div>
 <div class='content'>
  <div class='messages'>
   {{ messages }}
  </div>
