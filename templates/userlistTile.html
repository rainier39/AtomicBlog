<!-- pages/users.php -->
<div class='userlistTile' style='background: #{{{ color }}};'>
 <div class='userlistTileInner'>
  <div><a class='userlistTileName' href='{{{ profile }}}'>{{{ name }}}</a></div>
  <div>{{ role }}</div>
  <div>[[ user.joined: ]] <abbr class='date' title='{{{ jointime }}}'>{{{ joindate }}}</abbr></div>
  <div>[[ user.lastactive: ]] <abbr class='date' title='{{{ lastactivetime }}}'>{{{ lastactivedate }}}</abbr></div>
  {{ admininfo }}
 </div>
</div>
