<!-- core/install.php -->
  <h1>[[ install.installer ]]</h1>
  <form method='post' class='form installForm'>
   <input type='hidden' name='csrf_token' value='{{ token }}'>
   <div></div><h2>[[ install.sqldetails ]]</h2>
   <label for='sqlserver'>[[ install.sqlserver: ]]</label>
   <input type='text' placeholder='localhost' name='SQLServer' id='sqlserver' value='{{{ sqlserver }}}' required>
   <label for='sqldatabase'>[[ install.sqldatabase: ]]</label>
   <input type='text' name='SQLDatabase' id='sqldatabase' value='{{{ sqldb }}}' required>
   <label for='sqlusername'>[[ install.sqlusername: ]]</label>
   <input type='text' name='SQLUsername' id='sqlusername' value='{{{ sqluser }}}' required>
   <label for='sqlpassword'>[[ install.sqlpassword: ]]</label>
   <input type='password' name='SQLPassword' id='sqlpassword' required>
   <div></div><h2>[[ install.blogconfiguration ]]</h2>
   <label for='title'>[[ global.blogtitle: ]]</label>
   <input type='text' name='title' id='title' maxlength='32' value='{{{ title }}}' required>
   <label for='description'>[[ global.blogdescription: ]]</label>
   <textarea name='description' id='description' maxlength='128' required>{{{ description }}}</textarea>
   <label for='baseURL'>[[ install.baseurl: ]]</label>
   <input type='text' name='baseURL' id='baseURL' maxlength='128' value='{{{ baseURL }}}' required>
   <div></div><small>[[ install.baseurlwarning ]]</small>
   <div></div><h2>[[ install.owneraccountdetails ]]</h2>
   <label for='name'>[[ global.name: ]]</label>
   <input type='text' name='name' autocomplete='name' maxlength='64' id='name' value='{{{ name }}}' required>
   <label for='username'>[[ global.username: ]]</label>
   <input type='text' name='username' autocomplete='username' maxlength='32' id='username' value='{{{ username }}}' required>
   <label for='email'>[[ global.email: ]]</label>
   <input type='email' name='email' id='email' maxlength='64' value='{{{ email }}}' required>
   <label for='password'>[[ global.password: ]]</label>
   <input type='password' name='password' id='password' minlength='{{{ minlength }}}' required>
   <label for='repeatpassword'>[[ global.repeatpassword: ]]</label>
   <input type='password' name='repeatpassword' id='repeatpassword' minlength='{{{ minlength }}}' required>
   <div></div><h2>[[ install.settings ]]</h2>
   <label for='overwrite'>[[ install.overwrite: ]]</label>
   <input type='checkbox' name='overwrite' id='overwrite'{{ overwrite }}>        
   <br>
   <input type='submit' value='[[ install.install ]]' class='button'>
  </form>
