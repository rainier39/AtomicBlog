<!-- pages/post.php -->
  <div class='post'>
   <div class='postButtons'>
   {{ postbuttons }}
   </div>
   <div class='postHeader'>
   <h1>{{{ title }}}</h1>
   [[ global.by,author ]]
   <br>
   [[ post.published:,published ]]{% if (edited) %}[[ post.modified:,edited ]]{% endif %}
   {{ icon }}
   <p>
    <div class='tagslabel'>[[ global.tags: ]]</div>{{ tags }}
   </p>
   </div>
   <div class='postContent'>
   {{{{ content }}}}
   </div>
   <h2>[[ post.comments ]]</h2>
   {{ commentForm }}
   {{ pagination }}
   {{ comments }}
   {{ pagination }}
  </div>
